name: Validate and publish builder

on:
  pull_request:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.2'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: docker compose config --quiet

  image:
    needs: checks
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.2'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Derive image identity and eligible tags
        id: meta
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT: ${{ github.event_name }}
          COMMIT: ${{ github.sha }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          publish=false
          version=$(node -p 'require("./package.json").version')
          tags="$image:sha-$COMMIT"
          if [[ "$EVENT" != pull_request && "$REF" == "refs/heads/$DEFAULT_BRANCH" ]]; then
            publish=true
            tags="$tags,$image:edge"
          elif [[ "$EVENT" != pull_request && "$REF" =~ ^refs/tags/v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            version="${BASH_REMATCH[1]}"
            test "$version" = "$(node -p 'require("./package.json").version')"
            publish=true
            tags="$tags,$image:$version"
          elif [[ "$REF" == refs/tags/* ]]; then
            echo 'Use a vMAJOR.MINOR.PATCH tag matching package.json.' >&2
            exit 1
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "source=https://github.com/$REPOSITORY" >> "$GITHUB_OUTPUT"
      - name: Build test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: buildapk:local
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            SOURCE=${{ steps.meta.outputs.source }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and verify real signed APKs using disposable keys
        run: npm run smoke
      - name: Preserve smoke reports and build logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-verification
          path: |
            output/**/result.json
            output/**/build.log
            output/**/verification.json
          if-no-files-found: ignore
      - name: Login to GHCR
        if: steps.meta.outputs.publish == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified builder
        if: steps.meta.outputs.publish == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            SOURCE=${{ steps.meta.outputs.source }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
